const people={ISTJ:['노아','묵묵한 원칙주의자','한 번 맡은 일은 꾸준히 해내는 성실함이 돋보여요.','계획을 지키는 힘은 귀하지만, 예상 밖의 변화도 받아들여 보세요.','창세기 6–9장'],ISFJ:['룻','한결같은 동행자','작은 약속과 관계를 소중히 여기며 성실하게 돌봐요.','남을 돌보는 만큼 자신의 필요도 살펴주세요.','룻기 1–4장'],INFJ:['요셉','꿈꾸는 통찰가','눈앞의 어려움 너머에 있는 의미를 찾으려 해요.','모든 경험에 즉시 의미를 부여하지 않아도 괜찮아요.','창세기 37–50장'],INTJ:['다니엘','흔들리지 않는 전략가','깊은 생각과 분명한 기준으로 길을 찾아가요.','다른 사람의 속도와 방식에도 공간을 내어주세요.','다니엘 1–6장'],ISTP:['기드온','신중한 해결사','상황을 살피고 필요한 순간 현실적으로 움직여요.','혼자 해결하려 하기보다 도움을 청해도 좋아요.','사사기 6–8장'],ISFP:['다윗','감성적인 예술가','자신의 마음을 진솔하게 표현하고 아름다움을 발견해요.','감정이 요동칠 때 잠시 거리를 두고 바라보세요.','사무엘상 16장; 시편'],INFP:['예레미야','눈물의 이상주의자','소중한 가치에 진심을 다하고 아픔을 깊이 느껴요.','이상과 현실의 간격에서 스스로를 다그치지 마세요.','예레미야 1장, 20장'],INTP:['도마','질문하는 탐구자','쉽게 넘어가지 않고 스스로 이해하려는 태도가 강점이에요.','완벽히 이해하지 못해도 관계 안에서 걸어갈 수 있어요.','요한복음 20:24–29'],ESTP:['삼손','거침없는 행동파','도전을 두려워하지 않고 상황에 빠르게 반응해요.','결정 전에 잠깐 멈춰 결과를 살펴보세요.','사사기 13–16장'],ESFP:['베드로','뜨거운 열정가','마음을 표현하고 사람들과 함께 움직일 때 빛나요.','뜨거운 마음에 숙고의 시간을 더해보세요.','마태복음 14장; 요한복음 21장'],ENFP:['요나','감정 풍부한 자유인','가능성과 감정에 민감하며 자신만의 관점이 뚜렷해요.','내 기대와 다른 길에서도 배울 점을 찾아보세요.','요나 1–4장'],ENTP:['바울','논쟁하는 도전가','새로운 길을 개척하고 생각을 나누는 데 열정적이에요.','논쟁에서 이기는 것만큼 경청도 중요해요.','사도행전 17장'],ESTJ:['느헤미야','추진력 있는 관리자','목표를 정하고 사람들을 조직해 일을 완수해요.','효율만큼 사람들의 마음도 살펴주세요.','느헤미야 2–6장'],ESFJ:['마르다','따뜻한 살림꾼','사람들이 편안하도록 실제적인 돌봄을 건네요.','섬기지 않는 순간에도 충분히 소중한 존재예요.','누가복음 10:38–42'],ENFJ:['바나바','사람을 세우는 격려자','다른 사람의 가능성을 발견하고 함께 성장하도록 도와요.','모두를 책임지려는 마음은 잠시 내려놓아도 돼요.','사도행전 9:26–27; 11장'],ENTJ:['모세','사명 중심의 지도자','큰 방향을 보고 어려운 결정을 감당하려 해요.','리더에게도 쉼과 도움을 받을 자리가 필요해요.','출애굽기 3장, 18장']};
const enPeople={1:['바울','옳음을 향한 열심','올바르고 선한 삶을 살고 싶은 마음이 커요.','완벽해야 한다는 압박을 내려놓고 은혜를 돌아보세요.','빌립보서 3:4–9'],2:['마르다','사랑을 행동으로','필요한 사람이 되고 싶고 섬김으로 사랑을 표현해요.','도움이 되지 않는 순간에도 사랑받을 가치가 있어요.','누가복음 10:38–42'],3:['야곱','축복을 향한 달리기','성취와 인정을 통해 자신의 가치를 확인하려 해요.','성과와 상관없는 자신의 가치를 돌아보세요.','창세기 27장, 32장'],4:['다윗','진심을 노래하는 사람','나만의 정체성과 깊이 있는 진정성을 소중히 여겨요.','특별하지 않은 평범한 하루도 귀해요.','시편 51편'],5:['솔로몬','지혜를 구하는 탐구자','이해하고 준비할 때 안심하며 깊이 탐구해요.','모든 답을 얻기 전에도 삶에 참여할 수 있어요.','열왕기상 3:3–15'],6:['기드온','확신을 찾는 동행자','믿을 만한 기준과 안전을 중요하게 여겨요.','불확실함 속에서도 작은 한 걸음을 내디뎌 보세요.','사사기 6장'],7:['베드로','가능성에 뛰어드는 사람','새로운 기쁨과 자유, 경험을 갈망해요.','힘든 감정도 피하지 않고 머물러 볼 수 있어요.','마태복음 14:22–33'],8:['모세','불의에 맞서는 보호자','주도권과 독립성을 소중히 여기고 약자를 보호해요.','강함뿐 아니라 연약함을 나누는 용기도 있어요.','출애굽기 2장, 18장'],9:['이삭','평화를 지키는 사람','갈등보다 조화와 안정된 관계를 중요하게 여겨요.','평화를 위해 자신의 목소리를 지우지 않아도 돼요.','창세기 26:12–33']};
const EXTRA={"ISTJ":["작은 약속도 허투루 넘기지 않고, 누가 보지 않아도 맡은 자리를 지키는 편이에요. 익숙한 방식과 분명한 기준은 당신에게 안정감을 줍니다.","말보다 꾸준한 행동으로 신뢰를 쌓습니다. 다만 계획이 어긋나면 혼자 책임을 짊어지기 쉬워요.","노아는 긴 준비의 시간을 견디며 방주를 지었습니다. 성경은 그의 내면을 상세히 말하지 않지만, 오랜 순종의 장면은 당신의 성실함을 돌아보게 합니다.","내가 지키려는 원칙은 무엇을 보호하나요? 예상 밖의 상황에서도 사람을 향한 여유를 남길 수 있을까요?","창세기 6:22","노아는 하나님이 명하신 대로 행했습니다."],"ISFJ":["사람들의 작은 필요를 먼저 알아차리고, 관계를 오래 지키려 합니다. 눈에 띄는 성취보다 누군가의 곁을 지키는 일에서 보람을 느껴요.","성실한 돌봄과 세심한 기억력이 강점이에요. 그러나 거절해야 할 때에도 미안함 때문에 무리할 수 있습니다.","룻은 익숙한 땅을 떠나 나오미와 동행했습니다. 그녀의 선택은 관계를 지키는 용기와 실제적인 돌봄을 생각하게 합니다.","나는 누구를 위해 애쓰고 있나요? 내 필요를 표현하는 것도 관계를 지키는 방법일까요?","룻기 1:16","룻은 나오미와 함께 가겠다는 뜻을 분명히 했습니다."],"INFJ":["사건 뒤에 숨은 의미와 사람의 마음을 깊이 헤아립니다. 먼 미래를 내다보며 지금의 선택이 어떤 이야기가 될지 생각하는 편이에요.","통찰력과 관계에 대한 진지함이 강점입니다. 하지만 모든 일을 의미 있게 만들어야 한다는 부담을 느낄 수도 있어요.","요셉은 여러 번의 상실과 뜻밖의 전환을 경험했습니다. 훗날 형제들을 만났을 때 그는 자신의 삶을 더 넓은 시야에서 바라보았습니다.","지금 당장 이해되지 않는 경험을 억지로 설명하려 하지는 않나요? 누구와 나의 이야기를 안전하게 나눌 수 있을까요?","창세기 50:20","요셉은 고난의 역사를 생명을 살리는 관점에서 돌아보았습니다."],"INTJ":["큰 그림을 그린 뒤 그 목표에 맞는 길을 차분히 찾습니다. 시끄러운 분위기보다 스스로 생각할 시간이 있을 때 판단이 또렷해져요.","일관된 신념과 전략적인 사고가 강점입니다. 반면 다른 사람의 감정적 속도가 답답하게 느껴질 수 있어요.","다니엘은 낯선 제국에서도 자신의 기준을 지켰습니다. 상황을 읽는 지혜와 신념을 함께 생각해 볼 수 있습니다.","내가 확신하는 길을 설명할 때 상대의 두려움도 듣고 있나요? 혼자 모든 답을 찾아야 할까요?","다니엘 1:8","다니엘은 뜻을 정하고 자신의 신념을 지키려 했습니다."],"ISTP":["말로 오래 설명하기보다 상황을 관찰하고 필요한 행동을 찾는 편입니다. 직접 확인해 볼 수 있을 때 더 안심해요.","문제 해결력과 침착한 관찰이 강점입니다. 다만 속마음을 표현하지 않아 주변 사람이 당신을 이해하기 어려울 수 있어요.","기드온은 부르심 앞에서 질문하고 확인했습니다. 그의 망설임은 신중함과 두려움이 어떻게 얽히는지 돌아보게 합니다.","나는 어떤 순간에 직접 확인해야 안심하나요? 도움을 요청하는 것은 정말 능력 부족의 표시일까요?","사사기 6:15","기드온은 자신의 부족함을 솔직하게 말했습니다."],"ISFP":["감정과 가치가 마음속에서 조용히 깊어지는 편입니다. 나다운 방식으로 아름다움과 사랑을 표현하고 싶어 해요.","섬세한 감수성과 진정성이 강점입니다. 마음을 말로 풀기 전까지 혼자 오래 품을 수도 있습니다.","다윗은 기쁨과 두려움, 후회와 소망을 노래로 표현했습니다. 그의 시는 감정을 숨기지 않고 하나님 앞에 가져가는 모습을 보여줍니다.","내 마음을 표현할 안전한 방법은 무엇인가요? 오늘의 감정이 나의 전부라고 여기지는 않나요?","시편 51:10","다윗은 깨끗한 마음과 새로워진 영을 구했습니다."],"INFP":["당신은 겉으로 드러난 결과보다 그 안에 담긴 진심과 의미를 중요하게 여겨요. 다른 사람이 그냥 지나치는 슬픔이나 모순에도 마음이 오래 머물고, 자신이 믿는 가치가 훼손될 때 깊이 흔들릴 수 있습니다. 조용해 보여도 내면에는 쉽게 타협하지 않는 이상과 뜨거운 마음이 있어요.","진정성, 상상력, 공감 능력은 당신의 귀한 자원이에요. 누군가의 아픔을 쉽게 단정하지 않고 오래 곁에 머무를 수 있죠. 그러나 이상과 현실이 다를 때 스스로 무력하다고 느끼거나, 마음속 갈등을 혼자 감당하기도 합니다.","예레미야는 자신의 백성을 향한 애통함과 선지자로서의 소명 사이에서 씨름했습니다. 때로는 부르심의 무게를 원망하며 솔직한 마음을 토로했지만, 그 자리에서도 말씀을 외면할 수 없다고 고백했지요. 그의 이야기는 깊은 감수성이 단순한 연약함이 아니라 진실을 향한 민감함일 수 있음을 보여줍니다.","나는 지금 무엇을 지키고 싶어서 이렇게 마음이 아픈 걸까요? 모든 사람의 고통을 내가 책임져야 한다고 여기지는 않나요? 오늘 내가 할 수 있는 작고 구체적인 사랑의 행동은 무엇일까요?","예레미야 20:7–9","예레미야는 마음속에 타오르는 말씀을 더는 억누를 수 없다고 고백했습니다."],"INTP":["익숙한 답을 그대로 받아들이기보다 질문하며 스스로 납득하고 싶어 합니다. 혼자 생각할 때 새로운 연결을 발견해요.","논리적 탐구와 열린 질문이 강점입니다. 그러나 마음을 나누기보다 분석에만 머물 수도 있어요.","도마는 부활 소식을 듣고 직접 확인하고 싶어 했습니다. 그의 질문은 예수님과의 만남 속에서 새로운 고백으로 이어졌습니다.","내 질문은 무엇을 이해하려는 마음에서 시작되나요? 확실하지 않은 상태에서도 관계를 이어갈 수 있을까요?","요한복음 20:28","도마는 예수님을 만난 뒤 믿음의 고백을 드렸습니다."],"ESTP":["상황이 빠르게 바뀔수록 순발력이 살아납니다. 망설이기보다 직접 뛰어들며 배우는 편이에요.","실행력과 담대함이 강점입니다. 반면 즉각적인 선택이 오래 남길 결과를 놓칠 수 있어요.","삼손의 이야기에는 놀라운 힘과 충동적인 선택이 함께 등장합니다. 능력이 어떤 방향으로 사용되는지 생각해 볼 수 있어요.","지금의 용기가 누구를 위한 것인가요? 행동하기 전 잠깐 멈추면 무엇이 보일까요?","사사기 16:28","삼손은 마지막 순간 하나님께 힘을 구했습니다."],"ESFP":["사람들과 함께할 때 표정과 목소리에 에너지가 실립니다. 마음이 움직이면 행동으로 표현하고 싶어 해요.","따뜻한 표현력과 현장감이 강점입니다. 하지만 순간의 감정이 중요한 결정을 앞설 수도 있어요.","베드로는 물 위로 뛰어들고 예수님을 부인하기도 했습니다. 부활하신 예수님은 그를 다시 만나 사랑을 물으셨습니다.","내 열정은 어떤 사랑에서 시작되나요? 실수한 뒤에도 다시 시작할 용기를 낼 수 있을까요?","요한복음 21:17","예수님은 베드로에게 사랑을 물으시며 다시 사명을 맡기셨습니다."],"ENFP":["새로운 가능성을 보면 마음이 먼저 움직이고, 사람과 이야기에 풍부한 의미를 부여합니다. 자유롭게 상상할 공간이 필요해요.","열린 사고와 생동감이 강점입니다. 그러나 내 기대와 다른 현실을 만났을 때 감정의 폭이 커질 수 있어요.","요나는 자신의 기대와 다른 하나님의 자비 앞에서 갈등했습니다. 그 이야기는 나의 확신과 더 넓은 사랑 사이의 간격을 비춰 줍니다.","내가 원하는 결말만 좋은 결말이라고 생각하지는 않나요? 예상 밖의 사람을 향한 연민을 품을 수 있을까요?","요나 4:11","요나서는 니느웨를 향한 하나님의 긍휼을 묻는 질문으로 끝납니다."],"ENTP":["새로운 질문과 관점을 발견하면 대화가 즐거워집니다. 서로 다른 생각을 연결해 새로운 길을 찾는 데 흥미가 있어요.","창의적인 논증과 도전 정신이 강점입니다. 하지만 상대의 마음보다 논쟁 자체에 몰입할 수 있어요.","바울은 여러 도시에서 다양한 사람들과 복음을 논증했습니다. 그가 청중에 맞춰 소통하는 장면도 눈여겨볼 만합니다.","내 질문은 상대를 이해하도록 돕나요, 이기기 위한 도구가 되나요?","사도행전 17:22–23","바울은 아테네 사람들의 문화에서 대화의 출발점을 찾았습니다."],"ESTJ":["해야 할 일을 분명히 하고 사람들과 역할을 나누는 데 능숙합니다. 약속이 지켜질 때 공동체가 안정된다고 느껴요.","책임감과 조직력이 강점입니다. 그러나 모두가 같은 속도로 움직이기를 기대할 수 있어요.","느헤미야는 무너진 성벽을 살피고 사람들을 조직했습니다. 기도와 실제적인 계획이 함께 나타납니다.","성과를 향해 가는 동안 지친 사람의 목소리도 듣고 있나요?","느헤미야 2:17–18","느헤미야는 공동체를 일으켜 성벽 재건을 시작했습니다."],"ESFJ":["누가 무엇을 필요로 하는지 재빨리 알아차리고 따뜻하게 챙깁니다. 함께하는 자리의 분위기가 중요해요.","돌봄과 친화력이 강점입니다. 하지만 자신의 수고가 당연하게 여겨질 때 서운할 수 있어요.","마르다는 예수님을 집으로 맞아 섬겼고, 분주함 속에서 마음을 토로했습니다. 예수님은 그를 이름으로 부르며 말씀하셨습니다.","나는 어떤 순간에 인정받고 싶어지나요? 아무것도 하지 않아도 관계 안에 머물 수 있을까요?","누가복음 10:41–42","예수님은 마르다의 염려와 분주함을 알아보셨습니다."],"ENFJ":["사람 안의 가능성을 발견하면 기꺼이 응원하고 연결해 줍니다. 함께 성장하는 관계에서 큰 기쁨을 느껴요.","격려와 공감, 관계를 이끄는 힘이 강점입니다. 다만 모두의 성장을 책임지려 하면 지칠 수 있어요.","바나바는 바울을 공동체에 소개하고 마가에게 다시 기회를 주었습니다. 사람을 세우는 역할을 생각하게 합니다.","누군가를 돕는 동시에 그 사람의 선택을 존중하고 있나요?","사도행전 9:27","바나바는 바울을 사도들에게 데려가 그의 이야기를 전했습니다."],"ENTJ":["어려운 상황에서도 방향을 세우고 결단하려 합니다. 공동체가 나아갈 길을 제시하는 일에 책임을 느껴요.","비전과 결단력이 강점입니다. 하지만 모든 짐을 혼자 져야 한다는 압박에 지칠 수 있어요.","모세는 백성을 이끌며 수많은 판단을 감당했습니다. 이드로는 그에게 책임을 나누는 지혜를 권했습니다.","내가 맡은 책임 중 다른 사람과 나눌 수 있는 것은 무엇인가요?","출애굽기 18:17–18","이드로는 모세가 혼자 모든 일을 감당하기 어렵다고 조언했습니다."],"jesus":["사람들이 모인 자리에서 가르치시고, 한적한 곳에서 홀로 기도하셨습니다. 상처받은 사람의 필요를 살피면서도 진리를 분명하게 말씀하셨지요.","예수님은 성격검사의 한 유형으로 규정할 수 없는 분입니다. 이 결과는 누구보다 더 성숙하거나 균형 잡혔다는 뜻이 아니라, 다양한 모습으로 사람들을 만나신 예수님의 삶을 떠올리게 합니다.","예수님은 이른 새벽 홀로 기도하시다가도 제자들과 함께 여러 마을을 향해 나아가셨습니다. 사람을 향한 사랑과 아버지의 뜻을 향한 순종이 그분의 사역 속에 나타납니다.","나는 나와 다른 방식으로 생각하고 행동하는 사람을 어떻게 대하나요? 예수님의 삶에서 오늘 배우고 싶은 태도는 무엇인가요?","마가복음 1:35–39","예수님은 새벽에 한적한 곳에서 기도하시고, 이어 다른 마을로 가서 전도하셨습니다."]};const EN_EXTRA={"1":["옳고 그름에 민감하고 더 나은 삶을 위해 자신을 단련합니다. 양심의 기준이 높아 작은 잘못도 쉽게 지나치지 못할 수 있어요.","원칙과 책임감이 강점이지만, 마음속 비판의 목소리가 자신과 타인을 지치게 할 수 있습니다.","바울은 과거의 열심과 자랑을 그리스도를 아는 것에 비추어 다시 평가했습니다. 자신의 의를 붙들던 관점을 돌아보게 하는 이야기예요.","내가 바로잡으려는 것은 정말 사랑을 향하고 있나요? 나 자신에게도 은혜의 여지를 허락하나요?","빌립보서 3:7–9","바울은 이전에 유익하던 것들을 그리스도를 위해 새롭게 평가했습니다."],"2":["사람이 무엇을 필요로 하는지 민감하게 살피고 실제적인 도움으로 사랑을 표현합니다. 관계 안에서 자신이 소중한 존재이기를 바라요.","따뜻한 돌봄은 강점이지만, 부탁받지 않은 도움이나 인정에 대한 기대가 서운함으로 돌아올 수 있어요.","마르다는 예수님을 정성껏 맞이했지만 분주함 속에서 서운함을 토로했습니다. 예수님은 그 마음을 외면하지 않으셨지요.","오늘 내 마음이 정말 원하는 것은 무엇인가요? 도움을 주지 않을 때에도 사랑받을 수 있다고 믿나요?","누가복음 10:40–42","예수님은 분주한 마르다의 마음을 부르시며 중요한 것을 일깨우셨습니다."],"3":["목표가 생기면 열심히 달려가고 자신의 능력을 증명하고 싶어 합니다. 성취는 큰 활력이 되지만 실패는 자존감에 영향을 줄 수 있어요.","추진력과 적응력이 강점입니다. 다만 성과가 나의 전부가 되면 쉬는 시간에도 불안해질 수 있어요.","야곱은 축복을 얻기 위해 애썼고 얍복강에서 씨름한 뒤 새로운 이름을 받았습니다. 성취와 정체성을 돌아볼 장면이에요.","내가 아무것도 이루지 못한 날에도 나를 귀하게 여길 수 있나요? 정말 바라는 축복은 무엇인가요?","창세기 32:24–28","야곱은 밤새 씨름한 뒤 이스라엘이라는 이름을 받았습니다."],"4":["자신만의 진실한 감정과 의미를 소중히 여깁니다. 남들과 다른 깊이를 느끼는 만큼 이해받지 못한다는 외로움도 커질 수 있어요.","진정성과 표현력이 강점입니다. 하지만 비교와 결핍감에 오래 머무르면 지금 가진 것을 놓칠 수 있어요.","다윗은 시편에서 슬픔과 기쁨, 후회와 간구를 숨기지 않았습니다. 감정을 진솔하게 마주하는 태도를 성찰할 수 있어요.","나는 무엇이 부족하다고 느끼나요? 오늘 내게 이미 주어진 작고 평범한 선물은 무엇인가요?","시편 51:10–12","다윗은 새 마음과 회복의 기쁨을 간구했습니다."],"5":["충분히 이해하고 준비되어 있을 때 마음이 놓입니다. 지식과 혼자만의 시간은 중요한 자원이지만 사람의 요구가 버거울 때도 있어요.","깊은 탐구와 관찰력이 강점입니다. 다만 이해가 완벽해질 때까지 행동을 미루기 쉬워요.","솔로몬은 왕의 역할 앞에서 지혜를 구했습니다. 지식이 삶과 관계를 위해 어떻게 사용되는지 돌아보게 합니다.","내가 지금 더 알아야 할 것은 무엇이고, 이미 알고 있는 것으로 시작할 수 있는 것은 무엇인가요?","열왕기상 3:9","솔로몬은 백성을 분별하여 다스릴 지혜를 구했습니다."],"6":["불확실한 상황에서 위험을 살피고 믿을 만한 근거를 찾습니다. 충성심과 준비성이 크지만 걱정이 꼬리를 물기도 해요.","책임감과 위기 대비 능력이 강점입니다. 다만 완전한 확신이 오기 전까지 결정을 미루기 쉬워요.","기드온은 부르심 앞에서 두려워하며 표징을 구했습니다. 불확실함 가운데 내딛는 작은 걸음을 생각하게 합니다.","내가 확신을 얻기 위해 계속 확인하는 것은 무엇인가요? 지금 가능한 작은 한 걸음은 무엇일까요?","사사기 6:36–40","기드온은 표징을 구하며 자신이 받은 부르심을 확인했습니다."],"7":["새로운 가능성과 즐거움을 발견하는 데 능숙합니다. 답답한 상황에서 출구를 찾는 힘이 있지만 아픈 감정은 피하고 싶어질 수 있어요.","낙관과 창의성이 강점입니다. 다만 새로운 자극을 찾느라 중요한 감정을 충분히 돌보지 못할 수 있어요.","베드로는 물 위를 향해 담대하게 발을 내디뎠다가 두려움 속에서 도움을 구했습니다. 용기와 취약함이 함께 보이는 장면입니다.","내가 지금 피하고 싶은 감정은 무엇인가요? 즐거움이 없어도 머물러 볼 수 있는 자리는 어디인가요?","마태복음 14:28–31","베드로는 물 위로 나아갔다가 두려워하며 예수님께 도움을 구했습니다."],"8":["자기 삶의 주도권을 지키고 소중한 사람을 보호하려 합니다. 부당함에 맞서는 힘이 있지만 약한 모습을 보이기는 어려울 수 있어요.","결단력과 보호 본능이 강점입니다. 그러나 모든 상황을 통제하려 하면 가까운 사람도 부담을 느낄 수 있어요.","모세는 억압받는 사람의 고통을 보았고 훗날 백성을 이끌었습니다. 또한 혼자 모든 짐을 질 수 없음을 배웠습니다.","내가 강하게 지키려는 것은 무엇인가요? 신뢰하는 사람에게 나의 연약함을 보여줄 수 있나요?","출애굽기 18:17–23","이드로는 모세에게 책임을 나누어 감당하라고 조언했습니다."],"9":["평화로운 관계와 안정된 일상을 소중히 여깁니다. 다른 사람의 입장을 넓게 이해하지만 자기 욕구를 뒤로 미루기도 해요.","인내와 중재 능력이 강점입니다. 다만 갈등을 피하려다 중요한 자신의 목소리를 잃을 수 있어요.","이삭은 우물을 두고 다툼이 생기자 다른 곳으로 옮겼습니다. 평화를 선택하는 힘과 그 안에서 지킬 경계를 함께 생각해 볼 수 있습니다.","나는 평화를 위해 무엇을 포기하고 있나요? 사랑을 지키면서도 내 마음을 말할 수 있을까요?","창세기 26:22","이삭은 다툼이 없는 곳에서 우물을 얻고 그 땅의 넓음을 이야기했습니다."]};const DEEP={"ISTJ":["성실함이 사랑이 되는 자리","당신은 혼란스러운 순간에도 해야 할 일을 구체적으로 확인하고, 작은 약속을 지키며 공동체의 기반을 세우는 사람일 수 있어요. 다만 책임을 오래 붙잡다 보면 도움을 요청하는 일이 오히려 어렵게 느껴질 수 있습니다.","노아의 방주는 단번에 완성되지 않았습니다. 긴 준비와 반복되는 일 속에서 오늘의 한 걸음이 가진 의미를 떠올려 보세요.","최근 내가 묵묵히 감당해 온 일은 무엇인가요?|그 일을 잘하지 못하는 날에도 나는 나를 존중할 수 있나요?|누구에게 도움을 요청하면 짐을 조금 나눌 수 있을까요?","창세기 6:22"],"ISFJ":["곁을 지키는 사랑","누군가의 취향이나 필요를 기억하고, 말보다 행동으로 마음을 전하는 편일 수 있어요. 상대의 표정을 먼저 살피다 보면 내 마음은 뒤늦게 알아차리기도 합니다.","룻은 낯선 미래 앞에서 나오미와 함께 걷기로 선택했습니다. 돌봄은 일방적인 희생이 아니라 서로를 사람답게 대하는 관계에서 깊어질 수 있어요.","내가 돌보는 사람들에게 내 필요도 말하고 있나요?|거절이 곧 사랑의 부족이라고 느끼지는 않나요?|이번 주 나를 돌볼 작은 약속은 무엇인가요?","룻기 1:16"],"INFJ":["의미를 엮어 내는 시선","당신은 사람의 말 뒤에 숨은 마음을 읽고, 당장의 사건을 더 긴 이야기 속에서 이해하려 할 수 있어요. 이 통찰은 관계를 깊게 하지만 모든 아픔에 반드시 이유를 찾아야 한다는 부담도 만들 수 있습니다.","요셉의 삶에는 계획하지 않은 전환이 많았습니다. 시간이 흐른 뒤 그가 형제들과 마주한 장면을 통해, 지금은 이해되지 않는 경험을 서둘러 해석하지 않아도 된다는 점을 묵상해 보세요.","나는 누구의 마음을 지나치게 책임지고 있나요?|지금은 설명할 수 없는 경험을 그대로 둘 수 있나요?|나를 있는 그대로 들어줄 사람은 누구인가요?","창세기 50:20"],"INTJ":["먼 곳을 바라보는 기준","큰 그림을 세우고 복잡한 문제의 구조를 파악하는 데 강점이 있을 수 있어요. 스스로 세운 기준이 분명한 만큼 다른 사람의 느린 속도나 감정적인 표현이 답답하게 느껴질 수도 있습니다.","다니엘은 낯선 환경에서 자신의 신념을 지키면서도 지혜롭게 행동했습니다. 원칙을 지키는 일과 타인을 존중하는 일이 함께 가능하다는 점을 살펴보세요.","내 계획에 다른 사람의 목소리가 들어갈 자리가 있나요?|예상과 다른 길이 열릴 때 무엇을 지키고 무엇을 바꿀까요?|나는 누구에게 내 불확실함을 털어놓을 수 있나요?","다니엘 1:8"],"ISTP":["필요한 순간 움직이는 손","말보다 상황을 살피고 직접 해 보며 배우는 쪽이 자연스러울 수 있어요. 위기에는 침착하지만 마음의 고민을 설명하거나 오래 나누는 일은 어색할 수도 있습니다.","기드온은 두려움과 질문을 안고도 자신의 자리에서 한 걸음씩 나아갔습니다. 능숙한 행동만큼 망설임을 인정하는 태도도 중요합니다.","나는 무엇을 혼자 해결하려 하나요?|말로 표현하지 못한 감정은 무엇인가요?|오늘 시도해 볼 수 있는 작은 행동은 무엇인가요?","사사기 6:12"],"ISFP":["진심을 살아 내는 감각","사람과 공간의 분위기에 민감하고, 자신이 소중히 여기는 가치를 행동이나 예술로 표현할 수 있어요. 조용한 사람으로 보이더라도 마음속에는 선명한 애정과 확고한 기준이 있을 수 있습니다.","다윗은 음악과 시로 자신의 기쁨과 슬픔을 표현했습니다. 아름다운 표현 뒤에 있는 복잡한 마음까지 하나님 앞에 가져갈 수 있음을 생각해 보세요.","내 마음을 가장 잘 표현하는 방식은 무엇인가요?|갈등이 생겼을 때 내 가치를 어떻게 말할 수 있을까요?|오늘 나를 기쁘게 한 작은 장면은 무엇인가요?","시편 23:1"],"INFP":["눈물과 소망을 함께 품는 사람","당신은 사람과 세상을 쉽게 단정하지 않고, 자신이 옳다고 믿는 가치에 깊이 마음을 쏟는 편일 수 있어요. 다른 사람의 아픔에 오래 마음이 머물고, 현실이 이상과 다를 때 누구보다 크게 실망하기도 합니다. 겉으로는 조용해 보여도 마음속에서는 수많은 질문과 이야기가 이어질 수 있어요.","예레미야는 자신의 부르심 앞에서 두려워했고, 백성의 아픔을 보며 탄식했습니다. 그의 이야기는 깊이 느끼는 마음이 곧 약함은 아니라는 사실을 떠올리게 합니다. 동시에 모든 아픔을 혼자 짊어질 필요도 없음을 묵상해 보세요.","요즘 내 마음을 가장 오래 붙잡고 있는 가치는 무엇인가요?|세상이 내 기대와 다를 때 나는 나 자신에게 어떤 말을 하나요?|다른 사람의 아픔과 나의 책임 사이에 어떤 경계를 세울 수 있을까요?","예레미야 1:6–8"],"INTP":["질문에서 시작되는 믿음","남들이 당연하게 여기는 것도 다시 묻고, 스스로 납득할 수 있는 설명을 찾는 편일 수 있어요. 질문은 깊은 통찰을 낳지만 완벽히 이해하기 전에는 마음을 열기 어려울 수도 있습니다.","도마는 부활의 소식을 듣고 자신의 의문을 솔직하게 드러냈습니다. 그의 질문이 관계의 끝이 아니라 만남의 장면으로 이어졌다는 사실을 살펴보세요.","나는 어떤 질문을 오래 품고 있나요?|정답을 찾기 전에 신뢰할 수 있는 관계는 있나요?|오늘 이해보다 경험이 필요한 일은 무엇인가요?","요한복음 20:27"],"ESTP":["현장에서 길을 여는 용기","새로운 상황을 두려워하기보다 몸으로 부딪치며 배우는 편일 수 있어요. 빠른 판단과 추진력은 위기에서 빛나지만 순간의 흥분이 이후의 영향을 가릴 때도 있습니다.","삼손의 이야기는 놀라운 힘이 있다고 해서 모든 선택이 지혜로운 것은 아님을 보여 줍니다. 힘을 어디에 쓰는지가 더 중요하다는 점을 생각해 보세요.","나는 무엇을 너무 서둘러 결정하나요?|나의 용기가 누군가에게 어떤 영향을 주나요?|오늘 멈추고 확인할 한 가지는 무엇인가요?","사사기 16:28"],"ESFP":["사람들 사이에 번지는 온기","현장의 분위기를 빠르게 느끼고, 함께 웃고 움직일 때 생기가 도는 편일 수 있어요. 솔직한 표현은 관계를 가깝게 하지만 감정이 앞설 때는 말이 행동보다 빨리 나갈 수도 있습니다.","베드로는 열정적으로 예수님을 따르다가 두려움 앞에서 흔들렸습니다. 실패 이후 다시 부르심을 받은 이야기는 관계의 회복을 돌아보게 합니다.","나는 언제 가장 생기 있게 살아 있나요?|흥분하거나 두려울 때 내 말은 어떻게 달라지나요?|실수한 나를 다시 받아들이는 연습은 무엇일까요?","요한복음 21:17"],"ENFP":["가능성을 발견하는 상상력","새로운 사람과 이야기 속에서 아직 열리지 않은 가능성을 보는 편일 수 있어요. 자유와 의미를 소중히 여기지만 반복되는 의무나 마음이 불편한 문제 앞에서는 다른 길을 찾고 싶어질 수도 있습니다.","요나는 예상과 다른 하나님의 자비 앞에서 자신의 마음과 마주했습니다. 내가 기대한 이야기와 실제 펼쳐지는 이야기가 다를 때 무엇을 배우는지 생각해 보세요.","나는 어떤 가능성에 쉽게 설레나요?|불편해서 피하고 있는 책임은 무엇인가요?|내 예상과 다른 사람을 어떻게 바라볼 수 있을까요?","요나 4:10–11"],"ENTP":["질문으로 새로운 길을 만드는 사람","기존의 답을 그대로 받아들이기보다 여러 관점에서 다시 살피는 일이 즐거울 수 있어요. 논쟁은 당신에게 생각을 발전시키는 과정이지만 상대에게는 다르게 느껴질 수도 있습니다.","바울은 여러 도시와 사람들을 만나며 복음을 설명하는 방식을 달리했습니다. 자신의 생각을 전하는 열정과 상대를 이해하는 태도를 함께 살펴보세요.","내 질문은 상대를 이해하려는 질문인가요?|내가 틀렸을 가능성을 얼마나 열어 두나요?|오늘 설득보다 경청이 필요한 관계는 어디인가요?","사도행전 17:22–23"],"ESTJ":["함께 세우는 실행력","목표를 분명히 정하고 일을 실제로 끝내는 데 강점이 있을 수 있어요. 역할이 모호하거나 책임이 미뤄질 때 답답하지만, 모든 사람이 같은 속도로 움직이는 것은 아닙니다.","느헤미야는 무너진 성벽을 바라보는 데서 멈추지 않고 사람들과 함께 재건을 시작했습니다. 계획과 실행에 더해 공동체의 사정을 살피는 장면도 읽어 보세요.","나는 무엇을 지나치게 통제하려 하나요?|내가 세운 기준을 다른 사람은 어떻게 느낄까요?|오늘 함께 결정할 수 있는 일은 무엇인가요?","느헤미야 2:18"],"ESFJ":["환대가 머무는 자리","사람들이 편안하게 함께하도록 분위기를 살피고 실제적인 도움을 건네는 편일 수 있어요. 모두가 잘 지내기를 바라다 보면 자신의 피로와 서운함을 뒤로 미루기도 합니다.","마르다는 예수님을 자신의 집으로 맞이하며 분주하게 섬겼습니다. 예수님의 말씀은 돌봄 자체를 낮추기보다 분주함 속에서 마음이 어디에 머무는지 묻게 합니다.","나는 누구의 반응에 지나치게 마음이 흔들리나요?|나를 위한 쉼을 부탁할 수 있나요?|섬김을 잠시 멈추면 무엇이 느껴지나요?","누가복음 10:41–42"],"ENFJ":["사람을 세우는 격려","사람의 가능성을 발견하고 그 가능성이 자라도록 응원하는 데 기쁨을 느낄 수 있어요. 공동체의 분위기를 살피는 능력이 있지만 다른 사람의 변화까지 내 책임처럼 느낄 수도 있습니다.","바나바는 사람들을 격려하고 관계를 이어 주는 인물로 등장합니다. 그의 환대가 공동체를 어떻게 변화시켰는지 살펴보세요.","나는 누구를 지나치게 책임지고 있나요?|상대가 내 기대와 다르게 성장해도 응원할 수 있나요?|나를 격려해 주는 사람은 누구인가요?","사도행전 11:23–24"],"ENTJ":["방향을 정하고 길을 여는 사람","복잡한 상황에서 목표를 설정하고 사람들을 이끌 때 힘을 발휘할 수 있어요. 어려운 결정을 피하지 않지만 약한 모습을 보여 주는 일이 쉽지 않을 수 있습니다.","모세는 백성을 이끌면서도 혼자 모든 일을 감당할 수 없다는 조언을 들었습니다. 지도력은 모든 것을 직접 해내는 능력만이 아님을 생각해 보세요.","내가 놓지 못하는 책임은 무엇인가요?|누구에게 권한을 나눌 수 있나요?|내가 연약함을 드러내도 괜찮은 관계는 어디인가요?","출애굽기 18:17–18"],"jesus":["한 가지 유형으로 가둘 수 없는 만남","당신의 응답은 네 가지 지표에서 어느 한쪽으로 크게 치우치지 않았어요. 이는 다양한 상황에서 서로 다른 방식을 선택할 수 있음을 보여 주는 재미있는 결과입니다. 이것이 성숙함이나 신앙의 우월함을 뜻하지는 않아요.","복음서에서 예수님은 군중과 함께하시기도 하고 한적한 곳에서 기도하시기도 하셨습니다. 사람마다 다르게 만나셨던 장면을 따라 읽으며, 지금 나에게 필요한 사랑의 태도가 무엇인지 묵상해 보세요.","나는 어떤 상황에서 평소와 다른 모습을 보이나요?|지금 내게 필요한 것은 혼자 머무는 시간인가요, 누군가와 함께하는 시간인가요?|예수님이 사람들을 대하신 모습에서 오늘 실천하고 싶은 것은 무엇인가요?","마가복음 1:35–39"],"ennea1":["옳음을 향한 열심","바르게 살아야 한다는 내적 기준이 뚜렷할 수 있어요. 이 기준은 공동체에 신뢰를 주지만, 자신과 타인의 작은 실수에도 마음이 날카로워질 수 있습니다.","바울은 자신이 자랑하던 것들을 새롭게 바라보았습니다. 옳음을 추구하는 마음이 은혜와 만날 때 어떤 변화가 가능한지 생각해 보세요.","내가 가장 엄격하게 대하는 사람은 누구인가요?|잘못을 바로잡는 일과 사람을 존중하는 일을 어떻게 함께할까요?|오늘 내려놓아도 되는 완벽함은 무엇인가요?","빌립보서 3:7–9"],"ennea2":["필요한 사람이 되고 싶은 마음","사랑을 표현할 때 말보다 돌봄과 행동이 앞설 수 있어요. 누군가를 기쁘게 해 주는 일은 소중하지만, 그 반응으로 내 가치를 확인하려 하면 쉽게 지칠 수 있습니다.","마르다는 손님을 섬기는 분주함 속에서 자신의 마음을 드러냈습니다. 예수님이 그의 이름을 부르신 장면을 읽으며 나의 필요도 살펴보세요.","나는 어떤 순간에 서운함을 느끼나요?|도움을 주지 않는 날에도 사랑받는다고 느끼나요?|내가 부탁하고 싶은 도움은 무엇인가요?","누가복음 10:41–42"],"ennea3":["성취 너머의 이름","목표를 향해 달려가고 사람들에게 유능한 모습으로 기억되고 싶을 수 있어요. 성취가 삶의 동력이지만 실패가 곧 나의 가치에 대한 평가처럼 느껴질 때도 있습니다.","야곱은 축복을 얻기 위해 애썼고, 얍복강에서 새로운 이름을 받았습니다. 무엇을 이루었는가보다 나는 누구인가를 묻는 장면으로 읽어 보세요.","내가 가장 인정받고 싶은 사람은 누구인가요?|성과가 없는 하루에 나는 어떤 사람인가요?|나의 진짜 소망은 무엇인가요?","창세기 32:27–28"],"ennea4":["진정성의 깊이","남과 똑같은 답보다 나만의 감정과 의미를 소중히 여길 수 있어요. 깊이 느끼는 능력은 표현의 자원이지만 다른 사람과 비교하며 결핍을 크게 느낄 수도 있습니다.","다윗은 시편에서 자신의 후회와 슬픔을 감추지 않았습니다. 감정을 솔직히 마주하면서도 그 감정이 나의 전부는 아님을 생각해 보세요.","나는 무엇을 특별히 잃었다고 느끼나요?|오늘 이미 누리고 있는 평범한 선물은 무엇인가요?|내 마음을 안전하게 나눌 사람은 누구인가요?","시편 51:10–12"],"ennea5":["이해하려는 마음의 힘","충분히 알고 준비되었을 때 편안해질 수 있어요. 탐구와 관찰은 강점이지만 타인의 요구가 많아질수록 거리를 두고 싶어질 수 있습니다.","솔로몬은 지혜를 구했습니다. 이해를 쌓는 일이 실제 사람을 돕는 선택으로 어떻게 이어질 수 있는지 돌아보세요.","나는 무엇을 더 알아야 시작할 수 있다고 생각하나요?|내가 지키려는 혼자만의 시간은 얼마나 필요한가요?|오늘 이미 아는 것으로 실천할 일은 무엇인가요?","열왕기상 3:9"],"ennea6":["확신을 찾는 책임감","가능한 위험을 먼저 확인하고 믿을 수 있는 기준을 찾으려 할 수 있어요. 신중함은 공동체를 지키지만 확인이 끝나지 않아 시작을 미루기도 합니다.","기드온은 두려움 가운데 표징을 구했습니다. 확신이 충분하지 않아도 한 걸음을 내딛는 장면을 살펴보세요.","내가 계속 확인하는 것은 무엇인가요?|누구의 조언을 신뢰할 수 있나요?|오늘 가능한 가장 작은 용기는 무엇인가요?","사사기 6:36–40"],"ennea7":["가능성에 열려 있는 마음","새로운 경험과 기회를 발견하면 생기가 돌 수 있어요. 어려운 감정 앞에서 다른 즐거움으로 빨리 이동하고 싶은 마음도 생길 수 있습니다.","베드로는 물 위를 향해 발을 내디뎠다가 두려움 속에서 도움을 구했습니다. 용기와 취약함이 함께 있다는 사실을 생각해 보세요.","나는 어떤 불편한 감정을 피하고 있나요?|새로움이 없어도 머물 수 있는 관계는 무엇인가요?|오늘 끝까지 해 볼 한 가지는 무엇인가요?","마태복음 14:30–31"],"ennea8":["지키고 이끄는 힘","부당함을 보면 행동하고 소중한 사람을 보호하려는 마음이 강할 수 있어요. 하지만 누군가에게 의지해야 할 때는 내 주도권을 잃는 듯 불편할 수 있습니다.","모세는 백성을 이끌며 혼자 모든 짐을 질 수 없다는 사실을 배웠습니다. 강함과 도움을 요청하는 용기가 함께 갈 수 있음을 살펴보세요.","나는 무엇을 지키려고 강해지나요?|누구에게 약한 모습을 보여 줄 수 있나요?|지금 나눌 수 있는 책임은 무엇인가요?","출애굽기 18:17–18"],"ennea9":["평화를 지키는 조용한 힘","갈등의 양쪽을 이해하고 사람들 사이에 안정감을 만들 수 있어요. 그러나 평화를 지키기 위해 자신의 욕구를 오래 미루면 마음속에 서운함이 쌓일 수 있습니다.","이삭은 우물 문제로 다툼이 생기자 다른 곳으로 옮겼습니다. 평화를 선택하는 태도와 내 목소리를 지키는 태도가 어떻게 공존할 수 있을지 생각해 보세요.","나는 언제 내 의견을 숨기나요?|관계가 안전하다면 무엇을 말하고 싶나요?|오늘 표현할 작은 바람은 무엇인가요?","창세기 26:22"]};let mode=null,idx=0,answers=[],done={};const app=document.getElementById('app');function home(){mode=null;app.innerHTML=`<section class="card"><div class="welcomeArt" aria-hidden="true"><span>✦</span><span>🌿</span><span>✧</span><span>🌸</span><span>✦</span></div><h2 style="text-align:center;margin:6px 0 7px">어떤 검사를 해볼까요?</h2><p style="text-align:center;color:var(--muted);margin:0 0 22px">한 문항씩 답하고 나와 닮은 성경 인물을 만나보세요!</p><div class="tiles"><button class="tile" onclick="start('mbti')"><span class="ico">🌷</span><strong>성경 인물 MBTI</strong><small>36문항 · 16가지 성경 인물<br>성경 속 선택으로 알아보는 나의 성향</small></button><button class="tile" onclick="start('ennea')"><span class="ico">🌿</span><strong>성경 인물 에니어그램</strong><small>45문항 · 9가지 유형<br>나의 욕구와 두려움 알아보기</small></button></div>${Object.keys(done).length?'<div class="note">완료한 검사: '+Object.keys(done).map(x=>x==='mbti'?'MBTI':'에니어그램').join(', ')+'</div>':''}</section>`}function start(m){mode=m;idx=0;answers=Array(m==='mbti'?36:45).fill(null);render()}function render(){let data=mode==='mbti'?mbti:ennea,q=data[idx],v=answers[idx],isM=mode==='mbti';app.innerHTML=`<section class="card"><div class="meta"><span>${isM?'🌷 MBTI':'🌿 에니어그램'}</span><span>${idx+1} / ${data.length}</span></div><div class="progress"><div class="bar" style="width:${(idx+1)/data.length*100}%"></div></div><p class="ref">${q.ref}</p><h2 class="question">${q.q}</h2>${isM?`<p class="scene">${MBTI_CONTEXT[idx]}</p>`:""}${isM?`<button class="choice ${v===0?'active':''}" onclick="pick(0)"><span class="letter">A</span>${q.a}</button><button class="choice ${v===1?'active':''}" onclick="pick(1)"><span class="letter">B</span>${q.b}</button>`:`<p style="color:var(--muted);font-size:14px">이 문장이 평소 내 모습과 얼마나 닮았나요?</p><div class="scale">${[1,2,3,4,5].map(n=>`<button class="${v===n?'active':''}" onclick="pick(${n})">${n}</button>`).join('')}</div><div class="scaleLabels"><span>전혀 아니다</span><span>매우 그렇다</span></div>`}<div class="btnrow"><button class="btn secondary" onclick="prev()">${idx?'← 이전':'⌂ 처음'}</button><button class="btn" ${v===null?'disabled':''} onclick="next()">${idx===data.length-1?'결과 보기 ✨':'다음 →'}</button></div></section>`}function pick(v){answers[idx]=v;render()}function prev(){if(idx===0){if(confirm('검사를 나가면 현재 응답이 초기화돼요. 나갈까요?'))home()}else{idx--;render()}}function next(){if(answers[idx]===null)return;if(idx<answers.length-1){idx++;render()}else result()}
function result(){if(mode==='mbti'){let axes=['E','S','T','J'],pairs=['I','N','F','P'],counts=axes.map(a=>mbti.reduce((s,q,i)=>s+(q.axis===a&&answers[i]===0?1:0),0)),code=axes.map((a,i)=>counts[i]>=5?a:pairs[i]).join(''),hidden=counts.every(x=>x===4||x===5),p=hidden?['예수님','어느 한 유형으로 규정할 수 없는 특별한 결과','예수님은 많은 사람들 가운데서 가르치시고 홀로 기도하시며, 진리와 사랑을 삶으로 보여주셨어요.','다양한 방식으로 사람을 만나신 예수님의 삶을 묵상해 보세요.','마가복음 1:35–39']:people[code],key=hidden?'jesus':code;done.mbti=code;showResult('MBTI',key,hidden?'✦ HIDDEN ✦':code,p,`<h3>나의 네 가지 선호 지표</h3>${axes.map((a,i)=>`<div class="metric"><label>${a} / ${pairs[i]}</label><span>${counts[i]}</span><div class="track"><div class="fill" style="width:${counts[i]/9*100}%"></div></div><span>${9-counts[i]}</span></div>`).join('')}`,hidden)}else{let totals=Array(9).fill(0);ennea.forEach((q,i)=>totals[q.type-1]+=answers[i]);let rank=totals.map((n,i)=>({type:i+1,score:n})).sort((a,b)=>b.score-a.score||a.type-b.type),top=rank[0],p=enPeople[top.type];done.ennea=top.type;showResult('에니어그램','ennea'+top.type,'TYPE '+['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'][top.type-1],p,`<h3>나의 유형별 공감 점수</h3>${rank.map(r=>`<div class="metric"><label>${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'][r.type-1]}</label><div class="track"><div class="fill" style="width:${r.score/25*100}%"></div></div><span>${r.score}/25</span></div>`).join('')}<p style="font-size:13px;color:var(--muted)">동점이면 번호가 낮은 유형을 대표로 표시합니다. 점수는 유형 확정이 아닌 문항 공감 정도예요.</p>`,false)}}function showResult(test,key,tag,p,stats,hidden){
 const info=test==='MBTI'?EXTRA[key]:EN_EXTRA[Number(key.replace('ennea',''))];
 const [profile,relation,story,questions,verseRef,verseMeaning]=info;
 const [theme,inner,reflection,prompts,passage]=DEEP[key];
 const bookCodes={'창세기':'GEN','출애굽기':'EXO','룻기':'RUT','사사기':'JDG','사무엘상':'1SA','열왕기상':'1KI','시편':'PSA','잠언':'PRO','이사야':'ISA','예레미야':'JER','다니엘':'DAN','요나':'JON','마태복음':'MAT','마가복음':'MRK','누가복음':'LUK','요한복음':'JHN','사도행전':'ACT','로마서':'ROM','고린도전서':'1CO','갈라디아서':'GAL','빌립보서':'PHP','느헤미야':'NEH'};
 const match=passage.match(/^(.+?) (\d+)(?::(\d+))?/);
 const bibleUrl=match&&bookCodes[match[1]]?`https://www.bible.com/ko/bible/88/${bookCodes[match[1]]}.${match[2]}${match[3]?'.'+match[3]:''}.KRV`:null;
 const qs=prompts.split('|');
 app.innerHTML=`<section class="card ${hidden?'goldResult':''}"><div class="resultTitle"><div class="eyebrow">YOUR BIBLE CHARACTER · ${test}</div><img class="portrait" src="${ART[key]}" alt="${p[0]} 수채화 캐릭터"><div class="tag ${hidden?'goldTag':''}">${tag}</div><h2>${p[0]}</h2><div class="resultNickname">${p[1]}</div></div><div class="note ${hidden?'goldNote':''}">${hidden?'✦ HIDDEN · 황금빛 카드가 열렸어요 ✦':'🌸 성경 속 나의 인물 카드가 도착했어요!'}</div>
 <div class="resultSection"><h3>🌷 나는 이런 사람이에요</h3><p>${profile}</p><p>${inner}</p></div>
 <div class="resultSection"><h3>💗 나의 강점과 관계의 모습</h3><p>${relation}</p><p>이 성향이 건강하게 드러날 때에는 나와 주변 사람에게 든든한 자원이 됩니다. 반대로 지치거나 불안한 순간에는 익숙한 방식만 고집하기 쉬워요. 내 장점을 없애기보다 상황에 맞게 조절하는 연습이 필요합니다.</p></div>
 <div class="resultSection"><h3>📜 성경 속 인물의 이야기</h3><p>${story}</p><p>${reflection}</p></div>
 <div class="resultSection"><h3>🌿 나를 돌아보는 질문</h3><p class="reflectIntro">${theme} · 답을 서둘러 찾기보다 한 질문씩 천천히 머물러 보세요.</p><ol class="reflectList">${qs.map(q=>`<li>${q}</li>`).join('')}</ol></div>
 <div class="resultSection scripture"><h3>📖 함께 읽을 말씀 · 개역한글</h3><strong>${passage}</strong><p>이 본문을 읽으며 성경 인물이 마주한 상황과 자신의 마음을 함께 살펴보세요.</p>${bibleUrl?`<a class="bibleLink" href="${bibleUrl}" target="_blank" rel="noopener noreferrer">📖 개역한글 실제 성경 본문 읽기 ↗</a>`:''}<small>말씀을 요약문으로 대체하지 않고, 개역한글 본문으로 바로 연결했어요. 인터넷 연결 시 전체 말씀을 확인할 수 있습니다.</small><p class="moreReading">더 깊이 읽기 · ${p[4]}</p></div>
 <div class="resultSection">${stats}</div><div class="note">성격이론과 성경 이야기를 활용한 비표준화 자기성찰 활동입니다. 성경 인물의 실제 성격이나 신앙의 성숙도를 판정하지 않습니다.</div>
 <div class="btnrow"><button class="btn secondary" onclick="home()">다른 검사 하기</button><button class="btn" onclick="start('${mode}')">다시 검사하기</button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="shareResult('${test}','${p[0]}','${tag}')">결과 공유하기 ↗</button></section>`}
async function shareResult(test,name,tag){let t=`성경 인물 ${test} 테스트 결과: ${name} (${tag})`;if(navigator.share){try{await navigator.share({title:'성경 속 나는 누구일까?',text:t});return}catch(e){}}try{await navigator.clipboard.writeText(t);alert('결과 문구를 복사했어요!')}catch(e){alert(t)}}home();
</script></body></html>
